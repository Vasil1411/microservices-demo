services:
  frontend:
    build: ./src/frontend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - PRODUCT_CATALOG_SERVICE_ADDR=productcatalogservice:3550
      - CURRENCY_SERVICE_ADDR=currencyservice:7000
      - CART_SERVICE_ADDR=cartservice:7070
      - SHIPPING_SERVICE_ADDR=shippingservice:50051
      - CHECKOUT_SERVICE_ADDR=checkoutservice:5050
      - RECOMMENDATION_SERVICE_ADDR=recommendationservice:8080
      - AD_SERVICE_ADDR=adservice:9555
      - SHOPPING_ASSISTANT_SERVICE_ADDR=shoppingassistantservice:8080
    depends_on:
      - productcatalogservice
      - currencyservice
      - cartservice

  productcatalogservice:
    build: ./src/productcatalogservice
    ports:
      - "3550:3550"
    environment:
      - PORT=3550

  currencyservice:
    build: ./src/currencyservice
    ports:
      - "7000:7000"
    environment:
      - PORT=7000
      - DISABLE_PROFILER=1

  # Добавяме услугата за количка:
  cartservice:
    build: ./src/cartservice
    ports:
      - "7070:7070"
    environment:
      - PORT=7070
      - ASPNETCORE_URLS=http://0.0.0.0:7070
      - REDIS_ADDR=redis-cart:6379
    depends_on:
      - redis-cart

  # Добавяме Redis базата данни, която се изисква от количката:
  redis-cart:
    image: redis:alpine


  adservice:
    build: ./src/adservice
    ports:
      - "9555:9555"
    environment:
      - PORT=9555